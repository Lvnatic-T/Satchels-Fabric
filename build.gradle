plugins {
    id 'dev.architectury.loom' version '1.13-SNAPSHOT'
    id 'maven-publish'
    id 'co.uzzu.dotenv.gradle' version '4.0.0'
    id 'me.modmuss50.mod-publish-plugin' version '1.1.0'
}

loom {
    mixin {
        useLegacyMixinAp = true
    }
}

group = project.maven_group
version = project.mod_version

base {
    archivesName = project.archives_name
}

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        url = 'https://maven.wispforest.io/releases'
    }
    maven {
        url = 'https://maven.su5ed.dev/releases'
    }
    maven {
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    minecraft "net.minecraft:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modImplementation "io.wispforest:accessories-fabric:${project.accessories_version}"
    modCompileOnly "maven.modrinth:ouNrBQtq:nHhuPdda"
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
}

def modrinthId = (findProperty('modrinth_id') ?: '').toString().trim()
def curseforgeId = (findProperty('curseforge_id') ?: '').toString().trim()
def modrinthToken = env.MODRINTH_TOKEN.value
def curseforgeToken = env.CURSEFORGE_TOKEN.value

publishMods {
    file = tasks.remapJar.archiveFile
    changelog = file('CHANGELOG.md').text
    type = STABLE
    dryRun = !((findProperty('publishLive') ?: 'false').toString().toBoolean())
    modLoaders.add('fabric')

    if (modrinthId && modrinthToken) {
        modrinth('modrinthFabric') {
            accessToken = modrinthToken
            projectId = modrinthId
            minecraftVersions.add('1.21.1')
            requires('fabric-api')
            requires('accessories')
        }
    }
    if (curseforgeId && curseforgeToken) {
        curseforge('curseforgeFabric') {
            accessToken = curseforgeToken
            projectId = curseforgeId
            minecraftVersions.add('1.21.1')
            clientRequired = true
            serverRequired = true
            requires('fabric-api')
            requires('accessories')
        }
    }
}